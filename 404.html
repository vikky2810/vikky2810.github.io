<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found - Vikram Kamble</title>
  <meta name="description" content="That page doesn't exist. Links to the portfolio home page and the blog." />
  <!-- follow, so crawlers that land here still reach the real pages below -->
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#000000" />

  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" type="image/png" href="/src/assets/favicon-32x32.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="/src/assets/apple-touch-icon.png" sizes="180x180" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&display=swap" />

  <!-- Self-contained: this page is served at arbitrary URLs, so it should not
       depend on a site stylesheet path. -->
  <style>
    * { box-sizing: border-box; }

    ::selection {
      background-color: #f59e0b; /* --accent-color on the main site */
      color: #000000;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
      background: #000000;
      color: #ffffff;
      font-family: "Hanken Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }

    .code {
      margin: 0;
      font-size: clamp(3.5rem, 14vw, 4.5rem);
      font-weight: 800;
      line-height: 1;
      color: #d4d4d4;
    }

    h1 {
      margin: 1rem 0 0.75rem;
      font-size: 1.35rem;
      font-weight: 700;
    }

    p {
      margin: 0 0 2rem;
      color: #94a3b8;
    }

    .actions {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
    }

    .btn {
      padding: 0.55rem 0.8rem;
      border-radius: 0.4rem;
      border: 1px solid #262626;
      background: #171717;
      color: #ffffff;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      transition: opacity 0.2s ease;
    }

    .btn:hover { opacity: 0.85; }

    .btn-primary {
      background: #d4d4d4;
      border-color: #d4d4d4;
      color: #000000;
    }
  </style>
  <!-- Analytics: cookieless page views + goals, see src/analytics.js -->
  <script defer src="/src/analytics.js"></script>
</head>

<body>
  <main>
    <p class="code">404</p>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist or has been moved.</p>
    <div class="actions">
      <a class="btn btn-primary" href="/">Home</a>
      <a class="btn" href="/blog/">Blog</a>
    </div>
  </main>
</body>

</html>
